name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt ruff
      # Syntax errors and undefined names only: the script predates a lint config.
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python -c "import tagfinder"
      # No Bluetooth on the runner: start the app, let it draw its first screen, and exit on end of input.
      - run: python tagfinder.py < /dev/null | tee start.log && grep -q "TagFinder - Bluetooth Device Scanner" start.log

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
